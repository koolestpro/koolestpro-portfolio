<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OAuth Callback — Koolestpro</title>
<style>
  body { background:#0a0a0a; color:#e8e8e8; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; max-width:640px; margin:0 auto; padding:80px 24px; text-align:center; }
  h1 { color:#fff; font-size:22px; }
  .box { background:#151515; border:1px solid #FF9500; border-radius:12px; padding:24px; margin-top:24px; text-align:left; word-break:break-all; font-family:monospace; font-size:14px; color:#FF9500; }
  .hint { color:#888; font-size:14px; margin-top:20px; }
  button { background:#FF9500; color:#000; border:none; padding:10px 20px; border-radius:8px; font-weight:700; cursor:pointer; margin-top:16px; }
</style>
</head>
<body>
  <h1>Authorization complete</h1>
  <p class="hint">Copy the code below and send it back to Cowork.</p>
  <div class="box" id="params">reading query string...</div>
  <button onclick="copyIt()">Copy to clipboard</button>
  <script>
    const params = new URLSearchParams(window.location.search);
    const el = document.getElementById('params');
    if ([...params].length === 0) {
      el.textContent = 'No query parameters found. If TikTok redirected you here with an error, check the URL bar.';
    } else {
      el.textContent = [...params.entries()].map(([k, v]) => k + ' = ' + v).join('\n');
    }
    function copyIt() {
      navigator.clipboard.writeText(el.textContent);
    }
  </script>
</body>
</html>
